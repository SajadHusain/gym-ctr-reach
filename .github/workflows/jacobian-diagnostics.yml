name: Jacobian diagnostics
on:
  push:
    branches: [codex/jacobian-diagnostics]
  pull_request:
    paths:
      - 'ctr_reach_envs/ivp/diagnostic*.py'
      - 'ctr_reach_envs/mechanics/rl_jacobian.py'
      - 'ctr_reach_envs/training/original.py'
      - 'diagnose_original_jacobian.py'
      - 'tests/test_*diagnostic*.py'
      - '.github/workflows/jacobian-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[physics-train,test]"
      - run: python -m pytest tests/test_diagnostic_metrics.py tests/test_jacobian_diagnostics.py tests/test_original_ivp.py tests/test_actor_gradients.py tests/test_physics_observations.py -q -W error::RuntimeWarning
