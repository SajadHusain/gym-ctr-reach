name: Equilibrium mechanics

on:
  push:
    branches: [physics-equilibrium-step1]
    paths:
      - 'ctr_reach_envs/mechanics/**'
      - 'tests/test_mechanics.py'
      - 'tests/test_mechanics_step2.py'
      - 'tests/test_mechanics_tracking.py'
      - 'tests/test_mechanics_control.py'
      - 'tests/test_mechanics_rl.py'
      - 'tests/test_mechanics_jacobian.py'
      - 'tests/test_mechanics_study.py'
      - 'run_physics_study.py'
      - 'train_physics_ddpg_her.py'
      - 'evaluate_physics_ddpg_her.py'
      - 'pyproject.toml'
      - 'validate_mechanics.py'
      - 'validate_mechanics_step2.py'
      - 'validate_mechanics_step3.py'
      - 'validate_mechanics_step4.py'
      - '.github/workflows/mechanics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_mechanics.py tests/test_mechanics_step2.py tests/test_mechanics_tracking.py tests/test_mechanics_control.py -q
      - run: python validate_mechanics.py --samples-per-system 8 --output-dir runs/mechanics_ci
      - run: python validate_mechanics_step2.py --samples-per-system 2 --output-dir runs/mechanics_step2_ci
      - run: python validate_mechanics_step3.py --samples-per-system 1 --negative-cases 1 --output-dir runs/mechanics_step3_ci
      - run: python validate_mechanics_step4.py --episodes-per-system 2 --seed 7004 --output-dir runs/mechanics_step4_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanics-${{ matrix.os }}
          path: |
            runs/mechanics_ci/
            runs/mechanics_step2_ci/
            runs/mechanics_step3_ci/
            runs/mechanics_step4_ci/

  mechanics-rl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[physics-train,test]"
      - run: python -m pytest tests/test_mechanics_rl.py tests/test_mechanics_jacobian.py tests/test_mechanics_study.py -q -W error::RuntimeWarning
      - run: python train_physics_ddpg_her.py --total-timesteps 12 --learning-starts 4 --episode-steps 4 --hidden-width 32 --batch-size 8 --progress-every 2 --output-dir runs/mechanics_step5_ci
      - run: python evaluate_physics_ddpg_her.py runs/mechanics_step5_ci/final_model.zip --episodes 1 --max-steps 2 --output-dir runs/mechanics_step5_eval_ci
      - run: python train_physics_ddpg_her.py --physics-weight 0.1 --total-timesteps 12 --learning-starts 4 --episode-steps 4 --hidden-width 32 --batch-size 8 --progress-every 4 --output-dir runs/mechanics_step6_ci
      - run: python evaluate_physics_ddpg_her.py runs/mechanics_step6_ci/final_model.zip --episodes 1 --max-steps 2 --output-dir runs/mechanics_step6_eval_ci
      - run: python run_physics_study.py --stage all --seeds 7009 --total-timesteps 4 --learning-starts 2 --episode-steps 2 --checkpoint-freq 4 --hidden-width 16 --layers 2 --batch-size 4 --buffer-size 32 --eval-episodes 1 --eval-steps 2 --output-dir runs/mechanics_step7_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanics-rl-${{ matrix.os }}
          path: |
            runs/mechanics_step5_ci/
            runs/mechanics_step5_eval_ci/
            runs/mechanics_step6_ci/
            runs/mechanics_step6_eval_ci/
            runs/mechanics_step7_ci/
